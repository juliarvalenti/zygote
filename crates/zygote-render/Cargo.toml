[package]
name = "zygote-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zygote render engine: nannou/Bevy node-graph renderer as a library, plus the `zygote` binary"

[lib]
name = "zygote_render"
path = "src/lib.rs"

[[bin]]
name = "zygote"
path = "src/bin/zygote.rs"

[features]
default = ["camera"]
# Real capture devices through nokhwa (AVFoundation on macOS, V4L2 on Linux,
# Media Foundation on Windows). Without it only the `synthetic` device exists.
camera = ["dep:nokhwa"]
# Also watch Bevy's embedded assets (the shared WGSL module) for changes.
# Project node files are always hot-reloaded.
hot_reload = ["bevy/embedded_watcher", "bevy/file_watcher"]

[dependencies]
libc.workspace = true
zygote-core.workspace = true
zygote-macros.workspace = true
nannou.workspace = true
bevy = { workspace = true, features = ["bevy_pbr", "bevy_render", "bevy_asset", "bevy_image", "bevy_core_pipeline", "bevy_shader", "bevy_camera", "bevy_light", "bevy_mesh"] }
serde_json.workspace = true
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
anyhow.workspace = true
