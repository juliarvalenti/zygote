name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core + macros tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zygote-core -p zygote-macros

  check:
    name: check engine, UI and demo project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Bevy (nannou) and gpui
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libasound2-dev libudev-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  smoke:
    name: render every project headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries, Xvfb and the Mesa software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libasound2-dev libudev-dev libzstd-dev pkg-config \
            xvfb mesa-vulkan-drivers imagemagick
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Build and capture one frame per project, fail on errors or black frames
        run: scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-frames
          path: target/smoke/

  smoke-macos:
    name: render every project on Metal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install imagemagick
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Build and capture one frame per project on the real GPU
        run: scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-frames-macos
          path: target/smoke/
